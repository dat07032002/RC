joy:
  ros__parameters:
    device_id: 0
    deadzone: 0.01
    autorepeat_rate: 20.0
    coalesce_interval: 0.01

joy_teleop:
  ros__parameters:
    human_control:
      type: topic
      interface_type: ackermann_msgs/msg/AckermannDriveStamped
      topic_name: teleop
      # 8BitDo Ultimate 2C shoulder button.
      deadman_buttons: [6]
      axis_mappings:
        drive-speed:
          axis: 1
          # This 8BitDo reports forward stick as a negative axis value.
          # Invert it so forward commands positive vehicle speed.
          # School mapping safety cap: full stick is 1.0 m/s.
          scale: -1.0
          offset: 0.0
        drive-steering_angle:
          axis: 2
          scale: 0.34
          offset: 0.0

    autonomous_control:
      type: topic
      interface_type: std_msgs/msg/Int8
      topic_name: /dev/null
      deadman_buttons: [5]
      message_value:
        data:
          value: 0
