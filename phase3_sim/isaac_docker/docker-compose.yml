version: '3.8'

services:
  isaac-sim:
    image: nvcr.io/nvidia/isaac-sim:4.0.0
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility,graphics
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
    volumes:
      - ./workspace:/workspace
      - ./models:/models
      - ./logs:/logs
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
    ports:
      - "8888:8888"  # Jupyter
      - "5005:5005"  # Debug
    shm_size: '16gb'
    cap_add:
      - SYS_PTRACE
    command: bash -c "
      cd /workspace &&
      python3 train_env.py
    "

