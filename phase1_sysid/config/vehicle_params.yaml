# Roboracer Vehicle Parameters
# Fill in during Phase 1 System Identification
# See: implementation_guide.md Phase 1 for measurement procedures

vehicle:
  wheelbase: 0.33  # meters (measured: front wheel center to rear wheel center)
  track_width: 0.24  # meters (measured: left wheel center to right wheel center)
  # Itemized from manufacturer specs (2026-07-12): RTR-no-batt 2630 g (Traxxas)
  # - body shell ~175 - stock ESC/RX ~110 + VESC MkVI 232 (Trampa) + Orin Nano
  # devkit 176 (NVIDIA) + UST-10LX 130 + cabling ~100 + deck/DC-DC ~185
  # + battery 2872X 3S-5000 349 (12.3 oz). Range 3.45-3.60; weigh to confirm.
  mass: 3.52  # kg, itemized estimate (body shell OFF, 2872X battery IN)

# ============================================================================
# STEERING CONFIGURATION
# Measure using servo_test.py - record steering angles at PWM 1000, 1500, 2000
# ============================================================================
steering:
  pwm_center: 1500  # µs (neutral/center position)
  pwm_left_max: 1000  # µs (full left)
  pwm_right_max: 2000  # µs (full right)
  servo_center_command: 0.55  # calibrated midpoint; adjusted during floor tests

  # From servo_test.py: measure with phone level app
  angle_left_max: 24.93  # degrees; measured from R=0.710 m full-lock circle
  angle_right_max: 19.44  # degrees; measured from R=0.935 m full-lock circle
  angle_center: 0  # degrees approx; servo_center_command 0.55 drove straight on floor
  servo_gain_left: -0.9194  # servo units/rad: (0.15-0.55)/rad(24.93)
  servo_gain_right: -0.8842  # servo units/rad: (0.85-0.55)/rad(-19.44)

  # From slow-motion video (240fps, on stand): rightwheel.mp4 + leftwheel.mp4
  # Analyzed via frame-diff + correlation-to-pre/post. Full-range slew ~0.18-0.20s;
  # complete settle ~0.4s. Left step shows overshoot -> servo is underdamped.
  # Absolute deg & command->motion lag NOT measurable from these side-view clips
  # (steering rotates about a near-vertical axis => foreshortening, no in-plane spin;
  #  wheel-only framing => no command time-zero). Re-shoot overhead + marker + t0 to get them.
  servo_tau: 0.07  # seconds (1st-order equiv; ~95% in ~0.2s, slightly underdamped)
  servo_response_delay: 100  # ms (PLACEHOLDER, unmeasured - no time-zero in clips)
  servo_settle_time: 0.4  # seconds (full settle incl. overshoot, measured)

  max_steering_rate: 150  # degrees/sec (~25-30deg over ~0.19s measured slew)

# ============================================================================
# THROTTLE CONFIGURATION
# Measure using throttle_test.py - hold constant throttle, log velocity
# ============================================================================
throttle:
  pwm_center: 1500  # µs (idle/neutral)
  pwm_idle: 1500  # µs (no throttle)
  pwm_max_fwd: 2000  # µs (full forward)

  # From throttle_test.py at different levels
  max_velocity: 2.12  # m/s peak; controller capped to 2.0 m/s, test7_controller_1616
  # Provisional engineering estimate accepted after the hard-launch test showed
  # wheel slip (wheel odometry cannot measure chassis acceleration under slip).
  max_acceleration: 3.5  # m/s²; use 2.5-4.5 m/s² domain randomization until external measurement

  # Measured 2026-07-13 with VESC zero-current freewheel and the BNO086 at
  # ~103 Hz. Integrated forward acceleration lost 0.777 m/s in 1.272 s,
  # consistent with the commanded 0.8 m/s start. Mean coast acceleration was
  # -0.611 m/s² (median active acceleration -0.591 m/s²). Use roughly
  # [-0.50, -0.75] m/s² for sim DR. Sparse VESC odom alone overestimated -0.752.
  friction_coefficient: -0.611  # m/s² coast-down acceleration
  # Brake decel datapoint: controller test stopped from ~2 m/s in ~0.25 m
  # overshoot -> VESC watchdog braking ~4-9 m/s². Safety layer keeps 1.5
  # (conservative); sim brake DR 3-8 when braking is modeled.

  # From step response
  throttle_response_tau: 0.1  # seconds (1st-order lag time constant)
  throttle_response_delay: XXX  # ms

# ============================================================================
# KINEMATICS (Bicycle Model)
# Validate with kinematics_test.py - drive in circles, measure turning radius
# ============================================================================
kinematics:
  wheelbase: 0.33  # should match vehicle.wheelbase
  turning_radius_left: 0.710  # m, rear-axle center; outer/inner diameters 1.66/1.18 m
  turning_radius_right: 0.935  # m, rear-axle center; outer/inner diameters 2.11/1.63 m
  steering_gain_correction: 1.0  # direction-specific servo gains applied above
  # Formula: R = L / tan(steering_angle)
  # If measured_radius >> predicted_radius, increase this factor

# ============================================================================
# ODOMETRY CALIBRATION
# From odometry_test.py: drive 10m straight, measure reported distance
# Correction = ground_truth / reported_distance
# ============================================================================
odometry:
  # vesc_to_odom now propagates from VESC tachometer deltas, so irregular
  # telemetry cannot turn a late high-speed sample into a false position jump.
  speed_to_erpm_gain: 4529.41  # calibrated: 1925 tach counts / 4.25 m, with 6 counts/e-rev
  distance_correction_factor: 1.0  # validated against a physical straight run after fix
  velocity_correction_factor: 1.0  # shared calibrated eRPM conversion

# ============================================================================
# SENSOR CONFIGURATION
# ============================================================================
sensors:
  lidar:
    model: "Hokuyo 10LX"
    frequency: 40  # Hz (measured ~39.8 Hz on this UST-10LX)
    range_min: 0.0  # meters
    range_max: 30.0  # meters

    # From lidar_noise_test.py: position at known distances (measured on UST-10LX)
    noise_std_at_1m: 0.0032  # meters (measured; mean 1.036 m)
    noise_std_at_2m: 0.0042  # meters (measured; mean 2.006 m)
    noise_std_at_5m: 0.0054  # meters (measured; mean 4.757 m)
    noise_std_at_10m: 0.0080  # meters (predicted from fit; 10 m not measured)

    # Linear model: noise_std = a + b * distance  (fit over 1/2/5 m)
    noise_std_coefficient_a: 0.0029  # intercept (noise at 0 m)
    noise_std_coefficient_b: 0.00052  # slope (noise per meter)

    outlier_rate: 0.3  # percent (0.1-0.5% across 1/2/5 m)

    # Mounting offsets from rear axle center (REP-103: +x fwd, +y left, +z up).
    # Measured by tape 2026-07-11. z is ground -> scan-window center.
    # base_link -> laser static transform. Sanity-check x with: x = D - fwd_scan_range.
    x_offset: 0.295  # meters (forward)  [measured]
    y_offset: 0.0    # meters (lateral)  [centered]
    z_offset: 0.165  # meters (height)   [measured]
    yaw_offset: 0.0  # radians (mount rotation; confirm sensor forward-arrow points ahead)

  imu:
    # Production SparkFun BNO086 on Jetson I2C-7, address 0x4B. Stationary
    # 60-second calibration on 2026-07-13, sampled from /imu/data at 50 Hz.
    source: "bno086"
    topic: "/imu/data"
    orientation_mode: "game"  # no magnetometer; avoids motor/ESC heading jumps
    publish_rate_hz: 50.0
    gyro_bias: [-0.000003, 0.000005, 0.000005]  # rad/s (X, Y, Z)
    gyro_noise_std: 0.002347  # mean axis standard deviation, rad/s
    accel_bias: [0.2079, -0.4082, 9.6710]  # stationary mean including gravity, m/s²
    accel_noise_std: 0.0422  # mean axis standard deviation, m/s²
    # Stationary |accel| = 9.682 m/s², about 1.3% below standard gravity.

    backup_bmi160:
      topic: "/sensors/imu"
      gyro_bias: [-0.000346, -0.008216, -0.005997]  # rad/s
      gyro_noise_std: 0.004072  # rad/s
      accel_bias: [0.2539, 0.7187, 10.4849]  # stationary mean, m/s²
      accel_noise_std: 0.0273  # m/s²

    mounting:
      x_offset: 0.0  # meters
      y_offset: 0.0  # meters
      z_offset: 0.1  # meters

  camera:
    enabled: false  # set to true if using camera
    model: "unknown"
    resolution: [640, 480]  # width x height
    # Run camera_calib.py if enabled
    focal_length_x: XXX  # pixels
    focal_length_y: XXX  # pixels
    principal_point_x: XXX  # pixels
    principal_point_y: XXX  # pixels

# ============================================================================
# LATENCY BUDGET
# From latency_test.py: measure each stage, sum for total
# Target: <100ms total (ideally 50-80ms)
# ============================================================================
latency:
  lidar_frequency_hz: 40
  lidar_period_ms: 25  # = 1000 / 40

  # Profile with ROS timestamps
  lidar_to_slam_ms: 11  # nearest prior /scan -> /odom timestamp, 15 s sample
  slam_to_policy_ms: XXX
  policy_to_motor_ms: XXX

  total_latency_ms: XXX  # sum of above
  target_latency_ms: 100  # hard limit for real-time control

# ============================================================================
# ISAAC LAB SIMULATION PARAMETERS
# These are automatically used when training in Phase 3
# ============================================================================
isaac_lab:
  use_measured_dynamics: true  # use parameters from Phase 1
  gravity: [0, 0, -9.81]

  # Domain randomization ranges
  domain_randomization:
    corridor_width_range: [0.5, 2.0]  # meters
    num_turns_range: [3, 8]
    obstacle_density_range: [0.0, 0.5]

    lidar_noise_std: [0.03, 0.10]  # meters
    imu_gyro_bias_range: [-50, 50]  # deg/s
    actuator_delay_range: [20, 100]  # ms

